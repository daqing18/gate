name: VPN Gate Node Check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://daqing18.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'

      - name: Delete old workflow runs (keep latest)
        if: always()
        uses: actions/github-script@v7
        env:
          KEEP_RUNS: "1"
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = parseInt(process.env.KEEP_RUNS || '1', 10);
            // 定位当前 workflow
            const { data: { workflows } } = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const wf = workflows.find(w => w.name === context.workflow);
            if (!wf) { core.warning('未找到当前 workflow, 跳过清理'); return; }
            // 只处理已完成的 run (当前这条还在跑, 不会被列入; 再保险排除一次)
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: wf.id, status: 'completed', per_page: 100,
            });
            runs.sort((a, b) => b.run_number - a.run_number);
            const toDelete = runs.filter(r => r.id !== context.runId).slice(keep);
            core.info(`已完成 ${runs.length} 条, 保留最新 ${keep} 条, 删除 ${toDelete.length} 条`);
            for (const r of toDelete) {
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
              core.info(`已删除 run #${r.run_number} (${r.id})`);
            }
